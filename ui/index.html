<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Newman Trigger Dashboard</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #0d9488;
      --accent-2: #0f766e;
      --danger: #b91c1c;
      --success: #15803d;
      --border: #e5e7eb;
      --chip: #eff6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top left, #ecfeff 0%, var(--bg) 45%);
    }
    .wrap {
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 16px 24px;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 16px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 6px 24px rgba(15, 23, 42, 0.06);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 20px;
    }
    h2 {
      margin: 0 0 8px;
      font-size: 16px;
    }
    .sub {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 10px;
    }
    .row {
      display: grid;
      gap: 8px;
      margin-bottom: 10px;
    }
    .row.cols-2 { grid-template-columns: 1fr 1fr; }
    label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
      display: inline-block;
    }
    input, select, button, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 13px;
      font-family: inherit;
    }
    button {
      background: var(--accent);
      color: #fff;
      border: 0;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: var(--accent-2); }
    button.secondary {
      background: #f3f4f6;
      color: #111827;
      border: 1px solid var(--border);
    }
    .status {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: #f3f4f6;
      color: #111827;
    }
    .status.passed { background: #dcfce7; color: var(--success); }
    .status.failed { background: #fee2e2; color: var(--danger); }
    .status.running { background: #fef3c7; color: #92400e; }
    .kpis {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin: 10px 0;
    }
    .kpi {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
      text-align: center;
    }
    .kpi .v { font-size: 18px; font-weight: 700; }
    .kpi .k { color: var(--muted); font-size: 11px; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    th, td {
      text-align: left;
      padding: 8px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    th { color: var(--muted); font-weight: 600; }
    tr:hover { background: #f8fafc; cursor: pointer; }
    .mono {
      font-family: Consolas, Menlo, Monaco, "Courier New", monospace;
      font-size: 12px;
      word-break: break-all;
    }
    .links a {
      display: inline-block;
      margin-right: 8px;
      margin-bottom: 6px;
      color: #0f766e;
      text-decoration: none;
      font-size: 12px;
      background: var(--chip);
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid #bfdbfe;
    }
    .fail {
      margin: 8px 0;
      padding: 8px;
      border-left: 3px solid #ef4444;
      background: #fef2f2;
      font-size: 12px;
    }
    .tiny { font-size: 11px; color: var(--muted); }
    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .toolbar > * { flex: 1; }
    @media (max-width: 980px) {
      .wrap { grid-template-columns: 1fr; }
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="card">
      <h1>Newman Dashboard</h1>
      <div class="sub">Trigger runs and monitor API test history.</div>

      <div class="row">
        <div>
          <label>Base URL</label>
          <input id="baseUrl" value="http://localhost:8080" />
        </div>
      </div>

      <div class="row">
        <div>
          <label>Trigger Token</label>
          <input id="token" placeholder="x-trigger-token" />
        </div>
      </div>

      <div class="row cols-2">
        <div>
          <label>Mode</label>
          <select id="mode">
            <option value="ci">ci</option>
            <option value="full" selected>full</option>
          </select>
        </div>
        <div>
          <label>Wait Timeout (sec)</label>
          <input id="waitTimeoutSec" type="number" value="180" min="1" />
        </div>
      </div>

      <div class="row">
        <label><input type="checkbox" id="waitForCompletion" checked /> Wait for completion in same call</label>
      </div>

      <div class="row cols-2">
        <button id="triggerBtn">Run Tests</button>
        <button id="healthBtn" class="secondary">Health</button>
      </div>

      <div class="row">
        <div id="healthState" class="tiny">Health: unknown</div>
        <div id="triggerMsg" class="tiny"></div>
      </div>

      <hr style="border:none;border-top:1px solid var(--border);margin:12px 0;" />

      <h2>Filters</h2>
      <div class="toolbar">
        <select id="statusFilter">
          <option value="">status: all</option>
          <option value="running">running</option>
          <option value="passed">passed</option>
          <option value="failed">failed</option>
        </select>
        <select id="modeFilter">
          <option value="">mode: all</option>
          <option value="ci">ci</option>
          <option value="full">full</option>
        </select>
        <select id="sortFilter">
          <option value="desc" selected>newest</option>
          <option value="asc">oldest</option>
        </select>
      </div>

      <div class="toolbar">
        <input id="limit" type="number" value="25" min="1" max="200" />
        <input id="offset" type="number" value="0" min="0" />
      </div>

      <div class="row cols-2">
        <button id="refreshBtn" class="secondary">Refresh Runs</button>
        <button id="clearBtn" class="secondary">Clear Detail</button>
      </div>

      <div class="tiny" id="listMeta"></div>
    </section>

    <section class="card">
      <h2>Run History</h2>
      <table id="runsTable">
        <thead>
          <tr>
            <th>Run ID</th>
            <th>Status</th>
            <th>Mode</th>
            <th>Assertions</th>
            <th>Started</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <hr style="border:none;border-top:1px solid var(--border);margin:12px 0;" />

      <h2>Run Detail</h2>
      <div id="detailEmpty" class="tiny">Select a run to view details.</div>
      <div id="detailBox" style="display:none;">
        <div class="mono" id="detailRunId"></div>
        <div style="margin:6px 0;">
          <span id="detailStatus" class="status">unknown</span>
        </div>

        <div class="kpis">
          <div class="kpi"><div class="v" id="kpiReq">-</div><div class="k">Requests</div></div>
          <div class="kpi"><div class="v" id="kpiAsr">-</div><div class="k">Assertions</div></div>
          <div class="kpi"><div class="v" id="kpiFail">-</div><div class="k">Failed Asserts</div></div>
        </div>

        <div class="tiny" id="detailDuration"></div>
        <div class="tiny" id="detailResp"></div>

        <div class="links" id="artifactLinks"></div>

        <div id="failureList"></div>
      </div>
    </section>
  </div>

  <script>
    const state = {
      selectedRunId: null,
      pollTimer: null
    };

    const el = (id) => document.getElementById(id);

    const ids = {
      baseUrl: el('baseUrl'),
      token: el('token'),
      mode: el('mode'),
      waitForCompletion: el('waitForCompletion'),
      waitTimeoutSec: el('waitTimeoutSec'),
      triggerBtn: el('triggerBtn'),
      healthBtn: el('healthBtn'),
      refreshBtn: el('refreshBtn'),
      clearBtn: el('clearBtn'),
      healthState: el('healthState'),
      triggerMsg: el('triggerMsg'),
      runsTableBody: document.querySelector('#runsTable tbody'),
      listMeta: el('listMeta'),
      statusFilter: el('statusFilter'),
      modeFilter: el('modeFilter'),
      sortFilter: el('sortFilter'),
      limit: el('limit'),
      offset: el('offset'),
      detailEmpty: el('detailEmpty'),
      detailBox: el('detailBox'),
      detailRunId: el('detailRunId'),
      detailStatus: el('detailStatus'),
      kpiReq: el('kpiReq'),
      kpiAsr: el('kpiAsr'),
      kpiFail: el('kpiFail'),
      detailDuration: el('detailDuration'),
      detailResp: el('detailResp'),
      artifactLinks: el('artifactLinks'),
      failureList: el('failureList')
    };

    function savePrefs() {
      localStorage.setItem('newman.ui.baseUrl', ids.baseUrl.value.trim());
      localStorage.setItem('newman.ui.token', ids.token.value.trim());
    }

    function loadPrefs() {
      ids.baseUrl.value = localStorage.getItem('newman.ui.baseUrl') || ids.baseUrl.value;
      ids.token.value = localStorage.getItem('newman.ui.token') || '';
    }

    function headers() {
      const token = ids.token.value.trim();
      const h = {};
      if (token) h['x-trigger-token'] = token;
      return h;
    }

    async function api(path, options = {}) {
      const base = ids.baseUrl.value.trim().replace(/\/$/, '');
      const response = await fetch(base + path, {
        ...options,
        headers: {
          ...(options.headers || {}),
          ...headers()
        }
      });

      const contentType = response.headers.get('content-type') || '';
      const payload = contentType.includes('application/json') ? await response.json() : await response.text();

      if (!response.ok) {
        const msg = typeof payload === 'string' ? payload : (payload.error || JSON.stringify(payload));
        throw new Error(msg);
      }
      return payload;
    }

    function renderStatusChip(node, status) {
      node.className = 'status ' + (status || '');
      node.textContent = status || 'unknown';
    }

    function formatAssertion(summary) {
      const a = summary?.assertions;
      if (!a) return '-';
      return `${a.executed}/${a.failed}`;
    }

    function renderRuns(items) {
      ids.runsTableBody.innerHTML = '';
      if (!items.length) {
        const tr = document.createElement('tr');
        tr.innerHTML = '<td colspan="5" class="tiny">No runs found.</td>';
        ids.runsTableBody.appendChild(tr);
        return;
      }

      items.forEach((item) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="mono">${item.runId}</td>
          <td><span class="status ${item.status || ''}">${item.status || 'unknown'}</span></td>
          <td>${item.mode || '-'}</td>
          <td>${formatAssertion(item.summary)}</td>
          <td class="tiny">${item.startedAt || '-'}</td>
        `;
        tr.addEventListener('click', () => selectRun(item.runId));
        ids.runsTableBody.appendChild(tr);
      });
    }

    function renderDetail(data) {
      ids.detailEmpty.style.display = 'none';
      ids.detailBox.style.display = 'block';
      ids.detailRunId.textContent = data.runId;
      renderStatusChip(ids.detailStatus, data.status);

      const req = data.summary?.requests;
      const asr = data.summary?.assertions;
      ids.kpiReq.textContent = req ? req.executed : '-';
      ids.kpiAsr.textContent = asr ? asr.executed : '-';
      ids.kpiFail.textContent = asr ? asr.failed : '-';

      ids.detailDuration.textContent = `Duration: ${data.summary?.totalRunDuration || '-'}`;
      ids.detailResp.textContent = `Avg response: ${data.summary?.averageResponseTime || '-'}`;

      const links = [];
      const base = ids.baseUrl.value.trim().replace(/\/$/, '');
      if (data.artifactUrls?.log) links.push(['log', base + data.artifactUrls.log]);
      if (data.artifactUrls?.junit) links.push(['junit', base + data.artifactUrls.junit]);
      if (data.artifactUrls?.json) links.push(['json', base + data.artifactUrls.json]);
      if (data.artifactUrls?.html) links.push(['html', base + data.artifactUrls.html]);
      ids.artifactLinks.innerHTML = links.map(([name, url]) => `<a href="${url}" target="_blank" rel="noopener">${name}</a>`).join('');

      const fails = data.failureSummary || [];
      ids.failureList.innerHTML = fails.length
        ? fails.map((f) => `<div class="fail">${f}</div>`).join('')
        : '<div class="tiny">No failures captured.</div>';
    }

    async function loadHealth() {
      try {
        const d = await api('/health');
        ids.healthState.textContent = `Health: ${d.status} | activeRunId: ${d.activeRunId || '-'}`;
      } catch (error) {
        ids.healthState.textContent = `Health error: ${error.message}`;
      }
    }

    async function loadRuns() {
      const params = new URLSearchParams();
      params.set('limit', ids.limit.value || '25');
      params.set('offset', ids.offset.value || '0');
      if (ids.statusFilter.value) params.set('status', ids.statusFilter.value);
      if (ids.modeFilter.value) params.set('mode', ids.modeFilter.value);
      if (ids.sortFilter.value) params.set('sort', ids.sortFilter.value);

      try {
        const d = await api('/runs?' + params.toString());
        ids.listMeta.textContent = `Total: ${d.total} | Showing: ${d.count} | Offset: ${d.offset}`;
        renderRuns(d.items || []);
      } catch (error) {
        ids.listMeta.textContent = `List error: ${error.message}`;
        renderRuns([]);
      }
    }

    async function selectRun(runId) {
      state.selectedRunId = runId;
      try {
        const d = await api(`/runs/${encodeURIComponent(runId)}`);
        renderDetail(d);
      } catch (error) {
        ids.triggerMsg.textContent = `Detail error: ${error.message}`;
      }
    }

    function startPolling(runId) {
      stopPolling();
      state.pollTimer = setInterval(async () => {
        try {
          const d = await api(`/runs/${encodeURIComponent(runId)}`);
          renderDetail(d);
          if (d.status !== 'running') {
            stopPolling();
            await loadRuns();
          }
        } catch {
          stopPolling();
        }
      }, 2500);
    }

    function stopPolling() {
      if (state.pollTimer) {
        clearInterval(state.pollTimer);
        state.pollTimer = null;
      }
    }

    async function triggerRun() {
      ids.triggerMsg.textContent = 'Triggering...';
      savePrefs();
      const body = {
        mode: ids.mode.value,
        waitForCompletion: ids.waitForCompletion.checked,
        waitTimeoutSec: Number(ids.waitTimeoutSec.value || 180)
      };

      try {
        const d = await api('/run-tests', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        ids.triggerMsg.textContent = `Run: ${d.runId} | status: ${d.status}`;
        if (d.runId) {
          await selectRun(d.runId);
          if (d.status === 'accepted' || d.status === 'running') {
            startPolling(d.runId);
          }
        }
        await loadRuns();
        await loadHealth();
      } catch (error) {
        ids.triggerMsg.textContent = `Trigger error: ${error.message}`;
      }
    }

    function clearDetail() {
      stopPolling();
      state.selectedRunId = null;
      ids.detailBox.style.display = 'none';
      ids.detailEmpty.style.display = 'block';
      ids.failureList.innerHTML = '';
      ids.artifactLinks.innerHTML = '';
    }

    ids.triggerBtn.addEventListener('click', triggerRun);
    ids.healthBtn.addEventListener('click', loadHealth);
    ids.refreshBtn.addEventListener('click', loadRuns);
    ids.clearBtn.addEventListener('click', clearDetail);
    ids.baseUrl.addEventListener('change', savePrefs);
    ids.token.addEventListener('change', savePrefs);
    ids.statusFilter.addEventListener('change', loadRuns);
    ids.modeFilter.addEventListener('change', loadRuns);
    ids.sortFilter.addEventListener('change', loadRuns);

    loadPrefs();
    loadHealth();
    loadRuns();
  </script>
</body>
</html>
